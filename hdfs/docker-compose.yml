services:
  # ─────────────────────────────────────────────
  # Kafka
  # ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
      - platform

  # ─────────────────────────────────────────────
  # Kafka UI
  # ─────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - platform

  # ─────────────────────────────────────────────
  # HDFS NameNode
  # ─────────────────────────────────────────────
  namenode:
    platform: linux/amd64
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "9010:9000"
    environment:
      CLUSTER_NAME: hdfs-local
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
    volumes:
      - namenode:/hadoop/dfs/name
    networks:
      - platform

  # ─────────────────────────────────────────────
  # HDFS DataNode
  # ─────────────────────────────────────────────
  datanode:
    platform: linux/amd64
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-datanode
    hostname: datanode
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
    volumes:
      - datanode:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - platform

  # ─────────────────────────────────────────────
  # Kafka Connect
  # ─────────────────────────────────────────────
  connect:
    build:
      context: ./connect
    container_name: kafka-connect
    hostname: connect
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092

      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: hdfs-connect

      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components

      HADOOP_USER_NAME: root
      HDFS_USER: root

    depends_on:
      - kafka
      - namenode
    networks:
      - platform

  # ─────────────────────────────────────────────
  # Kafka Connect initialization
  # ─────────────────────────────────────────────
  connect-init:
    image: curlimages/curl:8.10.1
    container_name: kafka-connect-init
    depends_on:
      - connect
    volumes:
      - ./connector-config:/config:ro
    networks:
      - platform
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e

      echo "Waiting for Kafka Connect..."

      until curl -sf http://connect:8083/; do
        sleep 5
      done

      echo "Registering HDFS connector..."

      curl -f -sS -X PUT \
        -H "Content-Type: application/json" \
        --data @/config/hdfs-sink.json \
        http://connect:8083/connectors/hdfs-raw-sink/config

      echo
      echo "Connector registration completed."

volumes:
  namenode:
  datanode:

networks:
  platform:
    driver: bridge
